<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Nashama — Jordan National Football Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #C8102E;
    --red-dark: #9E0B22;
    --red-light: #F5E8EB;
    --gold: #B8953C;
    --gold-light: #F5F0E8;
    --white: #FFFFFF;
    --off-white: #FAFAFA;
    --gray-100: #F4F4F4;
    --gray-200: #E8E8E8;
    --gray-400: #9A9A9A;
    --gray-600: #555555;
    --dark: #111111;
    --font-display: 'Playfair Display', serif;
    --font-body: 'Inter', sans-serif;
    --font-arabic: 'Tajawal', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: var(--white);
    color: var(--dark);
    overflow-x: hidden;
  }

  body[lang="ar"] {
    font-family: var(--font-arabic);
    direction: rtl;
  }

  [data-en], [data-ar] { transition: opacity 0.25s ease; }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5vw;
    height: 64px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--gray-200);
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .nav-logo .star {
    width: 28px;
    height: 28px;
    fill: var(--red);
  }

  .nav-logo-text {
    font-family: var(--font-display);
    font-size: 1.1rem;
    color: var(--dark);
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .nav-links {
    display: flex;
    gap: 28px;
    list-style: none;
  }

  .nav-links a {
    font-size: 0.82rem;
    font-weight: 500;
    text-decoration: none;
    color: var(--gray-600);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--red); }

  .lang-btn {
    background: var(--red);
    color: white;
    border: none;
    padding: 6px 18px;
    border-radius: 100px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }

  .lang-btn:hover { background: var(--red-dark); transform: scale(1.04); }

  /* ── HERO ── */
  #hero {
    min-height: 100vh;
    background: var(--dark);
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 54px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 100px 5vw 60px;
  }

  /* Geometric red background graphic */
  .hero-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .hero-bg::before {
    content: '';
    position: absolute;
    right: -8vw;
    top: -10vh;
    width: 55vw;
    height: 120vh;
    background: var(--red);
    clip-path: polygon(30% 0%, 100% 0%, 100% 100%, 0% 100%);
    opacity: 0.93;
  }

  .hero-bg::after {
    content: '';
    position: absolute;
    right: 28vw;
    top: 0;
    width: 2px;
    height: 100%;
    background: rgba(255,255,255,0.08);
  }

  /* Large watermark "1921" (Jordan founded year) */
  .hero-watermark {
    position: absolute;
    bottom: -2vh;
    left: 3vw;
    font-family: var(--font-display);
    font-size: clamp(100px, 18vw, 260px);
    font-weight: 900;
    color: rgba(255,255,255,0.03);
    letter-spacing: -0.02em;
    pointer-events: none;
    user-select: none;
    line-height: 1;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6vw;
    align-items: center;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
  }

  .hero-left { max-width: 540px; }

  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--gold);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 26px;
    padding: 7px 18px;
    border: 1px solid rgba(184,149,60,0.32);
    border-radius: 100px;
    background: linear-gradient(90deg, rgba(184,149,60,0.1), rgba(184,149,60,0.02));
    opacity: 0;
    animation: fadeUp 0.7s 0.2s forwards;
  }

  .hero-eyebrow::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
    box-shadow: 0 0 10px 1px rgba(184,149,60,0.7);
  }

  .hero-title {
    font-family: var(--font-display);
    font-size: clamp(3rem, 6vw, 5.5rem);
    font-weight: 900;
    color: white;
    line-height: 1.0;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    text-shadow: 0 4px 32px rgba(0,0,0,0.35);
    opacity: 0;
    animation: fadeUp 0.7s 0.35s forwards;
  }

  .hero-title .accent { color: var(--red); }

  body[lang="ar"] .hero-title {
    font-size: clamp(2.5rem, 5.5vw, 5rem);
  }

  .hero-subtitle {
    font-family: var(--font-display);
    font-size: clamp(1rem, 2.2vw, 1.6rem);
    font-weight: 700;
    color: rgba(255,255,255,0.55);
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.7s 0.5s forwards;
    font-style: italic;
  }

  .hero-divider {
    width: 54px;
    height: 2px;
    background: linear-gradient(90deg, var(--gold), transparent);
    margin-bottom: 26px;
    opacity: 0;
    animation: fadeUp 0.7s 0.58s forwards;
  }

  body[lang="ar"] .hero-divider {
    background: linear-gradient(270deg, var(--gold), transparent);
  }

  .hero-desc {
    font-size: 0.95rem;
    line-height: 1.75;
    color: rgba(255,255,255,0.65);
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.7s 0.65s forwards;
  }

  .hero-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.7s 0.8s forwards;
  }

  .stat-cell {
    padding: 20px 16px;
    background: rgba(255,255,255,0.03);
    text-align: center;
    position: relative;
  }

  .stat-cell::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--gold), transparent);
    opacity: 0.55;
  }

  .stat-cell:not(:last-child) { border-right: 1px solid rgba(255,255,255,0.08); }

  .stat-num {
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: 900;
    color: var(--red);
    line-height: 1;
    display: block;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 0.68rem;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .hero-right {
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    animation: fadeIn 1s 0.6s forwards;
  }

  /* SVG Jordan emblem */
  .emblem-wrap {
    position: relative;
    width: clamp(220px, 30vw, 380px);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .emblem-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(200,16,46,0.25);
    animation: pulseRing 3s ease-in-out infinite;
  }

  .emblem-ring:nth-child(2) {
    inset: 16px;
    border-color: rgba(184,149,60,0.35);
    animation-delay: 0.5s;
  }

  .emblem-ring:nth-child(3) {
    inset: 32px;
    border-color: rgba(200,16,46,0.08);
    animation-delay: 1s;
  }

  .emblem-core {
    position: relative;
    z-index: 2;
    width: 60%;
    aspect-ratio: 1;
    background: radial-gradient(circle at 35% 28%, rgba(200,16,46,0.22), rgba(200,16,46,0.08) 70%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(184,149,60,0.55);
    box-shadow: 0 0 36px rgba(200,16,46,0.22), inset 0 0 22px rgba(255,255,255,0.04);
  }

  .emblem-star-svg {
    width: 55%;
    height: 55%;
    fill: var(--red);
    opacity: 0.9;
    filter: drop-shadow(0 0 12px rgba(200,16,46,0.6));
  }

  /* ── SECTIONS ── */
  section { padding: 96px 5vw; }

  .section-inner {
    max-width: 1200px;
    margin: 0 auto;
  }

  .section-eyebrow {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--red);
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .section-eyebrow::after {
    content: '';
    flex: 1;
    max-width: 48px;
    height: 1px;
    background: var(--red);
  }

  .section-title {
    font-family: var(--font-display);
    font-size: clamp(2rem, 4vw, 3.2rem);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--dark);
    margin-bottom: 48px;
  }

  /* ── TIMELINE ── */
  #achievements { background: var(--off-white); }

  .timeline {
    position: relative;
    padding-left: 32px;
  }

  body[lang="ar"] .timeline {
    padding-left: 0;
    padding-right: 32px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, var(--red), var(--red-light));
  }

  body[lang="ar"] .timeline::before {
    left: auto;
    right: 0;
  }

  .tl-item {
    position: relative;
    margin-bottom: 48px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .tl-item.visible { opacity: 1; transform: translateY(0); }

  .tl-dot {
    position: absolute;
    left: -39px;
    top: 4px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--red);
    border: 3px solid var(--off-white);
    box-shadow: 0 0 0 2px var(--red);
  }

  body[lang="ar"] .tl-dot {
    left: auto;
    right: -39px;
  }

  .tl-year {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 6px;
  }

  .tl-title {
    font-family: var(--font-display);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 8px;
  }

  .tl-body {
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--gray-600);
    max-width: 700px;
  }

  .tl-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 14px;
    background: var(--red-light);
    color: var(--red);
    border-radius: 100px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
  }

  /* ── PLAYERS / PITCH ── */
  #squad { background: var(--white); }

  .pitch-wrap {
    background: linear-gradient(175deg, #1a4a1e 0%, #1e5523 30%, #1a4a1e 60%, #163d19 100%);
    border-radius: 20px;
    padding: 40px 32px;
    position: relative;
    overflow: hidden;
  }

  /* Pitch lines */
  .pitch-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .pitch-lines svg {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    opacity: 0.18;
  }

  .pitch-formation-label {
    text-align: center;
    color: rgba(255,255,255,0.45);
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .pitch-row {
    display: flex;
    justify-content: center;
    gap: clamp(8px, 2vw, 28px);
    margin-bottom: clamp(18px, 2.5vw, 32px);
  }

  .player-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: default;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .player-card.visible { opacity: 1; transform: translateY(0); }

  .player-circle {
    width: clamp(52px, 7vw, 72px);
    height: clamp(52px, 7vw, 72px);
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: clamp(1rem, 1.6vw, 1.4rem);
    font-weight: 900;
    color: white;
    transition: background 0.25s, border-color 0.25s, transform 0.2s;
    position: relative;
  }

  .player-circle.captain {
    border-color: var(--gold);
    background: rgba(184, 149, 60, 0.15);
  }

  .captain-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 18px;
    height: 18px;
    background: var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: 900;
    color: white;
  }

  .player-card:hover .player-circle {
    background: rgba(200,16,46,0.4);
    border-color: var(--red);
    transform: scale(1.1);
  }

  .player-name {
    text-align: center;
    color: rgba(255,255,255,0.9);
    font-size: clamp(0.58rem, 0.9vw, 0.75rem);
    font-weight: 600;
    line-height: 1.3;
    max-width: clamp(64px, 9vw, 90px);
  }

  .player-pos {
    font-size: clamp(0.52rem, 0.75vw, 0.65rem);
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 500;
  }

  /* Player detail cards below pitch */
  .player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-top: 48px;
  }

  .pcard {
    border: 1px solid var(--gray-200);
    border-radius: 14px;
    padding: 20px 22px;
    background: var(--white);
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.5s, transform 0.5s, border-color 0.2s, box-shadow 0.2s;
  }

  .pcard.visible { opacity: 1; transform: translateY(0); }
  .pcard:hover { border-color: var(--red); box-shadow: 0 4px 24px rgba(200,16,46,0.08); }

  .pcard-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }

  .pcard-num {
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: 900;
    color: var(--red);
    line-height: 1;
    min-width: 36px;
    opacity: 0.25;
  }

  .pcard-name {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--dark);
    line-height: 1.3;
  }

  .pcard-pos-tag {
    display: inline-block;
    padding: 2px 10px;
    background: var(--red-light);
    color: var(--red);
    border-radius: 100px;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .pcard-club {
    font-size: 0.8rem;
    color: var(--gray-400);
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pcard-club::before {
    content: '⚽';
    font-size: 0.7rem;
  }

  /* ── COACH ── */
  #coach { background: var(--dark); color: white; }

  #coach .section-title { color: white; }

  .coach-grid {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 64px;
    align-items: start;
  }

  .coach-card-visual {
    background: rgba(200,16,46,0.08);
    border: 1px solid rgba(200,16,46,0.2);
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .coach-card-visual::before {
    content: '';
    position: absolute;
    bottom: -30px;
    right: -30px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: rgba(200,16,46,0.06);
    pointer-events: none;
  }

  .coach-initials {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 2.2rem;
    font-weight: 900;
    color: white;
    margin: 0 auto 20px;
    letter-spacing: 0.04em;
  }

  .coach-fullname {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 900;
    color: white;
    margin-bottom: 6px;
  }

  .coach-title-tag {
    display: inline-block;
    padding: 4px 14px;
    background: rgba(200,16,46,0.2);
    border: 1px solid rgba(200,16,46,0.35);
    color: var(--red);
    border-radius: 100px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .coach-mini-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    text-align: center;
  }

  .cms-cell {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 14px 8px;
  }

  .cms-val {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--red);
  }

  .cms-lbl {
    font-size: 0.62rem;
    font-weight: 600;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  .coach-bio { }

  .coach-bio p {
    font-size: 0.93rem;
    line-height: 1.8;
    color: rgba(255,255,255,0.65);
    margin-bottom: 18px;
  }

  .coach-achievements {
    list-style: none;
    margin-top: 28px;
  }

  .coach-achievements li {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 0.88rem;
    color: rgba(255,255,255,0.7);
    line-height: 1.5;
  }

  .coach-achievements li::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red);
    margin-top: 7px;
    flex-shrink: 0;
  }

  /* ── WORLD CUP BANNER ── */
  #worldcup {
    background: var(--red);
    padding: 72px 5vw;
    text-align: center;
    color: white;
    position: relative;
    overflow: hidden;
  }

  #worldcup::before {
    content: '2026';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--font-display);
    font-size: clamp(120px, 22vw, 280px);
    font-weight: 900;
    color: rgba(255,255,255,0.05);
    pointer-events: none;
    line-height: 1;
  }

  .wc-eyebrow {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    margin-bottom: 12px;
  }

  .wc-title {
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 900;
    color: white;
    line-height: 1.1;
    margin-bottom: 16px;
    position: relative;
  }

  .wc-sub {
    font-size: 1rem;
    color: rgba(255,255,255,0.7);
    max-width: 560px;
    margin: 0 auto 36px;
    line-height: 1.7;
    position: relative;
  }

  .wc-group-box {
    display: inline-flex;
    gap: 0;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
  }

  .wc-group-item {
    padding: 14px 24px;
    font-size: 0.82rem;
    font-weight: 700;
    color: rgba(255,255,255,0.85);

    background: rgba(0,0,0,0.15);
    transition: background 0.2s;
  }

  .wc-group-item:last-child { border-right: none; }
  .wc-group-item.highlight { background: rgba(0,0,0,0.35); color: white; }

  /* ── FOOTER ── */
  footer {
    background: #0A0A0A;
    padding: 56px 5vw 40px;
    color: rgba(255,255,255,0.45);
  }

  .footer-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 40px;
  }

  .footer-left { }

  .footer-brand {
    font-family: var(--font-display);
    font-size: 1.1rem;
    font-weight: 900;
    color: rgba(255,255,255,0.85);
    margin-bottom: 6px;
  }

  .footer-tagline {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.04em;
  }

  .footer-credit {
    text-align: right;
    font-size: 0.78rem;
  }

  .credit-label {
    color: rgba(255,255,255,0.25);
    margin-bottom: 6px;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .credit-name {
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--red);
    letter-spacing: 0.02em;
  }

  .credit-sub {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.2);
    margin-top: 2px;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes pulseRing {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%       { transform: scale(1.04); opacity: 0.5; }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 860px) {
    .hero-content { grid-template-columns: 1fr; gap: 40px; }
    .hero-right { order: -1; }
    .emblem-wrap { width: clamp(140px, 45vw, 200px); }
    .coach-grid { grid-template-columns: 1fr; gap: 36px; }
    .nav-links { display: none; }
    .hero-stats { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 600px) {
    section { padding: 64px 6vw; }
    #hero { padding: 86px 6vw 48px; }
    .hero-desc { font-size: 0.9rem; }
    .pitch-wrap { padding: 26px 14px; }
    .pitch-row { gap: clamp(10px, 4vw, 20px); }
    .coach-card-visual { padding: 28px 18px; }
    .coach-mini-stats { gap: 8px; }
    .wc-sub { font-size: 0.92rem; }
    .nav-logo-text { font-size: 1rem; }
    nav { padding: 0 4vw; height: 58px; }
    .hero-watermark { bottom: 0; opacity: 0.025; }
  }

  @media (max-width: 520px) {
    .hero-stats { grid-template-columns: 1fr; }
    .stat-cell:not(:last-child) { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .stat-cell::before { width: 2px; height: auto; top:0; bottom:0; left:0; right:auto; background: linear-gradient(180deg, var(--gold), transparent); }
    .player-grid { grid-template-columns: 1fr 1fr; }
    .wc-group-box { flex-direction: column; }
    .wc-group-item { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.15); }
    .footer-inner { flex-direction: column; }
    .footer-credit { text-align: left; }
  }

  @media (max-width: 400px) {
    .hero-title { font-size: clamp(2.4rem, 11vw, 3.2rem); }
    body[lang="ar"] .hero-title { font-size: clamp(2.1rem, 10vw, 3rem); }
    .player-grid { grid-template-columns: 1fr; }
    .pcard { padding: 16px 18px; }
    .coach-mini-stats { grid-template-columns: 1fr 1fr; }
  }

  /* Arabic overrides */
  body[lang="ar"] .section-eyebrow::after {
    /* flip direction handled by RTL */
  }

  body[lang="ar"] .hero-eyebrow::before {
    order: 2;
  }

  body[lang="ar"] .coach-achievements li::before {
    margin-top: 7px;
  }

  /* Scroll reveal */
  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.65s ease, transform 0.65s ease;
  }
  .reveal.visible { opacity: 1; transform: translateY(0); }
</style>

           data-ar="وُلد جمال السلامي في 6 أكتوبر 1970 في حي درب ميلان بالدار البيضاء، المغرب. جمع بين التفوق الأكاديمي وحب كرة القدم، إذ حصل على شهادة الباكالوريا في العلوم بينما صعد في صفوف الشباب ليصبح لاعطاً محترفاً في الوسط."></p>

        <p data-en="In June 2024, the Jordan Football Association appointed Sellami as head coach on a three-year contract. His tactical hallmark — a compact 3-4-2-1 that shifts to a near-impenetrable 5-4-1 out of possession — transformed Jordan into one of Asia's most disciplined sides. He is known as a data pioneer, one of the first African coaches to integrate complex tracking analytics into training and match preparation."

<script>
  // ── Language System ──
  const langBtn = document.getElementById('langToggle');
  const body = document.body;

  function setLang(lang) {
    body.lang = lang;
    body.dir = lang === 'ar' ? 'rtl' : 'ltr';
    langBtn.textContent = lang === 'ar' ? 'English' : 'عربي';

    document.querySelectorAll('[data-en][data-ar]').forEach(el => {
      const text = el.getAttribute('data-' + lang);
      if (text !== null) {
        // use innerHTML so HTML tags like <span> work in hero title
        if (el.tagName === 'H1' || el.classList.contains('hero-title')) {
          el.innerHTML = text;
        } else {
          el.textContent = text;
        }
      }
    });

    localStorage.setItem('nashama-lang', lang);
  }

  langBtn.addEventListener('click', () => {
    setLang(body.lang === 'ar' ? 'en' : 'ar');
  });

  // Init saved lang
  const saved = localStorage.getItem('nashama-lang');
  if (saved) setLang(saved);
  else setLang('en');

  // ── Scroll Reveal ──
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.12 });

  document.querySelectorAll('.tl-item, .pcard, .reveal').forEach(el => observer.observe(el));

  // Stagger player cards in pitch
  const pitchCards = document.querySelectorAll('.player-card');
  const pitchObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const delay = parseInt(entry.target.dataset.delay || 0);
        setTimeout(() => entry.target.classList.add('visible'), delay);
      }
    });
  }, { threshold: 0.1 });

  pitchCards.forEach(c => pitchObserver.observe(c));

  // Stagger pcard items
  const pcards = document.querySelectorAll('.pcard');
  const pcardObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 60);
      }
    });
  }, { threshold: 0.05 });
  pcards.forEach(c => pcardObserver.observe(c));

  // ── Smooth active nav highlighting ──
  const sections = document.querySelectorAll('section[id]');
  const navLinks = document.querySelectorAll('.nav-links a');
  window.addEventListener('scroll', () => {
    let current = '';
    sections.forEach(s => {
      if (window.scrollY >= s.offsetTop - 100) current = s.id;
    });
    navLinks.forEach(a => {
      a.style.color = a.getAttribute('href') === '#' + current ? 'var(--red)' : '';
    });
  });
</script>
